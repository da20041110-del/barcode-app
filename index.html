<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>バーコード商品検索</title>
  <script src="https://unpkg.com/@zxing/library@latest"></script>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 10px;
      margin: 0;
      background-color: #f4f4f9;
    }

    #interactive {
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
      height: 280px;
      background: #000;
      position: relative;
      overflow: hidden;
      border-radius: 8px;
    }

    #video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .result-card {
      max-width: 500px;
      margin: 20px auto;
      padding: 15px;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      text-align: left;
    }

    .result-item {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #eee;
    }

    .result-item:last-child {
      border-bottom: none;
    }

    .label {
      font-weight: bold;
      color: #555;
    }

    .value {
      color: #222;
    }
  </style>
</head>
<body>

  <h2>バーコード商品検索</h2>

  <div id="interactive">
    <video id="video"></video>
  </div>

  <div class="result-card">
    <div class="result-item">
      <span class="label">JANコード</span>
      <span class="value" id="res-jan">-</span>
    </div>
    <div class="result-item">
      <span class="label">商品名</span>
      <span class="value" id="res-name">-</span>
    </div>
    <div class="result-item">
      <span class="label">税込単価</span>
      <span class="value" id="res-price">-</span>
    </div>
    <div class="result-item">
      <span class="label">マスタ価格</span>
      <span class="value" id="res-master-price">-</span>
    </div>
  </div>

  <script>
    let products = [];

    // products.json の読み込み
    fetch('products.json')
      .then(response => response.json())
      .then(data => {
        products = data;
      })
      .catch(err => console.error('json読み込みエラー:', err));

    // 商品情報の表示処理
    function displayProduct(janCode) {
      const product = products.find(p => (p.jan || p.code) === janCode);

      document.getElementById('res-jan').textContent = janCode;

      if (product) {
        document.getElementById('res-name').textContent = product.name || '-';
        document.getElementById('res-price').textContent = product.price ? `${product.price.toLocaleString()}円` : '-';
        document.getElementById('res-master-price').textContent = product.masterPrice ? `${product.masterPrice.toLocaleString()}円` : '-';
      } else {
        document.getElementById('res-name').textContent = '未登録の商品';
        document.getElementById('res-price').textContent = '-';
        document.getElementById('res-master-price').textContent = '-';
      }
    }

    // カメラとスキャナの初期化
    const codeReader = new ZXing.BrowserMultiFormatReader();
    codeReader.decodeFromVideoDevice(null, 'video', (result, err) => {
      if (result) {
        displayProduct(result.text);
      }
    }).catch(err => console.error('カメラ初期化エラー:', err));
  </script>

</body>
</html>
