<script>
    let products = {};
    let isPaused = false;
    const videoElement = document.getElementById('video');
    const interactiveDiv = document.getElementById('interactive');
    const resultDiv = document.getElementById('result');

    // products.jsonからデータ読み込み（自動補正機能つき）
    fetch('./products.json')
      .then(response => response.json())
      .then(data => {
        if (Array.isArray(data)) {
          data.forEach(item => {
            // "barcode" や "jan" など表記ゆれに対応し、文字列化＆空白除去
            const code = item.barcode || item.jan || item.code;
            if (code) {
              products[String(code).trim()] = item;
            }
          });
        } else {
          Object.keys(data).forEach(key => {
            products[String(key).trim()] = data[key];
          });
        }
      })
      .catch(err => console.error('データ読込エラー:', err));

    // 商品検索＆画面表示処理
    function displayProduct(rawBarcode) {
      // 読み取ったバーコードの文字前後の空白を自動削除
      const barcode = String(rawBarcode).trim();

      if (products[barcode]) {
        const item = products[barcode];
        resultDiv.innerHTML = `
          <div class="product-name">${item.name || '名称不明'}</div>
          <div class="product-price">価格: ${item.price ? String(item.price).replace(/円/g, '').trim() + '円' : '未設定'}</div>
          <p><small>JAN: ${barcode}</small></p>
        `;
      } else {
        resultDiv.innerHTML = `
          <p style="color: #dc3545; font-weight: bold;">未登録の商品です</p>
          <p><small>JAN: ${barcode}</small></p>
        `;
      }
    }

    // ① 手入力検索機能
    function searchManualBarcode() {
      const input = document.getElementById('manualBarcode');
      const barcode = input.value.trim();
      if (!barcode) {
        alert('JANコードを入力してください');
        return;
      }
      displayProduct(barcode);
    }

    // ③ 読み取り精度向上設定（ZXing）
    const hints = new Map();
    hints.set(ZXing.DecodeHintType.TRY_HARDER, true);

    const codeReader = new ZXing.BrowserMultiFormatReader(hints);
    codeReader.timeBetweenDecodingAttempts = 200;

    // カメラ起動とスキャン処理
    codeReader.decodeFromConstraints({
      video: { facingMode: "environment" }
    }, 'video', (result, err) => {
      if (result && !isPaused) {
        const barcode = result.text;
        
        // ② 読み取り完了時のアクション（静止画化＆枠の緑点灯）
        isPaused = true;
        videoElement.pause();
        interactiveDiv.classList.add('scan-success');

        // 結果表示
        displayProduct(barcode);

        // 2.5秒後に再開
        setTimeout(() => {
          videoElement.play();
          interactiveDiv.classList.remove('scan-success');
          isPaused = false;
        }, 2500);
      }
    }).catch(err => {
      console.error('カメラ起動エラー:', err);
    });
  </script>
